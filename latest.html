<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latest Episode · The Daily Frequency</title><style>body{font-family:system-ui;background:#f3eee5;color:#203637;margin:0}main{max-width:750px;margin:auto;padding:20px}.panel{background:#1a3437;color:#fff1df;padding:25px;border-radius:20px}h1,h2{font-family:Georgia,serif}a{color:#b66b37}audio{width:100%;margin:15px 0}.part{padding:19px;background:white;border-radius:14px;margin:13px 0;line-height:1.65}.small{color:#7b8a84;font-size:13px}.panel a{color:#efb887}button{border-radius:20px;border:0;background:#e6aa72;padding:12px 16px;font-weight:700}</style></head><body><main><div class="panel"><p style="letter-spacing:2px;font-size:11px">THE DAILY FREQUENCY</p><h1>Today's episode</h1><p id="meta">Checking for the latest narrated episode…</p><audio id="player" controls preload="none" style="display:none"></audio><p id="status" class="small" style="color:#d2dcd4"></p><p><a href="./">← Back to the station</a></p></div><section id="episode"></section></main><script>
(async()=>{const el=id=>document.getElementById(id);try{let r=await fetch('./daily/latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('No produced episode yet');const ep=await r.json();el('meta').textContent=(ep.title||'The Daily Frequency')+' · '+(ep.date||'Date unavailable');const player=el('player');player.src='./daily/latest.mp3?date='+encodeURIComponent(ep.date||'');player.style.display='block';el('status').textContent='Prerecorded, free-generated narration. If the date is not today, the daily production has not successfully refreshed.';(ep.segments||[]).forEach(s=>{const box=document.createElement('article');box.className='part';const h=document.createElement('h2');h.textContent=s.title||'Segment';box.appendChild(h);for(const paragraph of (s.paragraphs||[])){const p=document.createElement('p');p.textContent=paragraph;box.appendChild(p)}if(s.sources?.length){const foot=document.createElement('p');foot.className='small';foot.textContent='Sources: ';s.sources.forEach((src,i)=>{if(i)foot.append(' · ');const a=document.createElement('a');a.href=src.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=src.title||'Source';foot.appendChild(a)});box.appendChild(foot)}el('episode').appendChild(box)})}catch(e){el('meta').textContent='No published audio episode yet';el('status').textContent='The scripted pilot remains on the main page. The scheduled research and GitHub narration handoff has not been confirmed. We will not present an old episode as new.'}})();
</script></body></html>
